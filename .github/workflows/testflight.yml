name: TestFlight Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.PRODUCT_BUNDLE_IDENTIFIER || 'com.triphabibi.atriawallai' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Check required Apple secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done

          if [ -z "$ASC_PRIVATE_KEY" ] && [ -z "$ASC_PRIVATE_KEY_BASE64" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 or APP_STORE_CONNECT_API_KEY_P8_BASE64 is required"
            missing=1
          fi

          exit "$missing"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          if [ -n "$ASC_PRIVATE_KEY_BASE64" ]; then
            printf "%s" "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          else
            printf "%s\n" "$ASC_PRIVATE_KEY" > "$key_path"
          fi

          mkdir -p private_keys "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"
          install -m 600 "$key_path" "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$key_path" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$key_path" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          install -m 600 "$key_path" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Write build secrets config
        run: |
          cat > Config/Secrets.xcconfig <<EOF
          GEMINI_API_KEY = $GEMINI_API_KEY
          PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID
          EOF

      - name: Generate export options plist
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>signingStyle</key>
          	<string>automatic</string>
          	<key>teamID</key>
          	<string>$APPLE_TEAM_ID</string>
          	<key>stripSwiftSymbols</key>
          	<true/>
          	<key>uploadSymbols</key>
          	<true/>
          </dict>
          </plist>
          EOF

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project AtriaWallAI.xcodeproj -scheme AtriaWallAI

      - name: Run simulator tests before upload
        run: |
          xcodebuild \
            -project AtriaWallAI.xcodeproj \
            -scheme AtriaWallAI \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive release build
        run: |
          xcodebuild \
            -project AtriaWallAI.xcodeproj \
            -scheme AtriaWallAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AtriaWallAI.xcarchive \
            clean archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/AtriaWallAI.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          ipa_path="$(find build/export -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "::error::No IPA was exported"
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --file "$ipa_path" \
            --type ios \
            --apiKeyPath "$ASC_KEY_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AtriaWallAI-IPA
          path: build/export/*.ipa
          if-no-files-found: ignore
